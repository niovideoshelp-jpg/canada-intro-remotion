# Renderiza os videos na nuvem (GitHub Actions) — o PC local nao precisa renderizar nada.
# Dispara sozinho a cada push em main que mude os videos (renderiza todos, em paralelo), ou manualmente em
# Actions > Render video > Run workflow (escolha um video e, se quiser, um intervalo de frames).
# Cada MP4 fica em: Actions > (execucao) > Artifacts > canada-intro / canada-part1 / canada-part2 / canada-final
name: Render video

on:
  workflow_dispatch:
    inputs:
      video:
        description: 'Qual video renderizar'
        type: choice
        options: [todos, intro, part1, part2, final]
        default: todos
      frames:
        description: 'Intervalo de frames para um teste rapido (ex: 0-300). Vazio = video inteiro.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/crt-post.mjs'
      - 'remotion.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render.yml'

concurrency:
  # um grupo por video: renderizar a Parte 2 nao cancela a Parte 1 (um novo push/dispatch do MESMO video cancela o anterior)
  group: render-${{ github.ref }}-${{ inputs.video || 'todos' }}
  cancel-in-progress: true

jobs:
  choose:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          VIDEO: ${{ inputs.video || 'todos' }}
        run: |
          all='[{"key":"intro","id":"CanadaIntro"},{"key":"part1","id":"CanadaPart1"},{"key":"part2","id":"CanadaPart2"},{"key":"final","id":"CanadaFinal"}]'
          if [ "$VIDEO" = todos ]; then m="$all"; else m=$(echo "$all" | jq -c --arg k "$VIDEO" '[.[] | select(.key == $k)]'); fi
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  render:
    needs: choose
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.choose.outputs.matrix) }}
    name: render ${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias do sistema (Chrome headless + ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 libxkbcommon0 libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
            libasound2t64 fonts-noto-color-emoji
          ffmpeg -hide_banner -version | head -1

      - name: Instalar pacotes
        run: npm ci

      - name: Baixar Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Renderizar (Remotion)
        env:
          FRAMES: ${{ inputs.frames }}
        run: npx remotion render src/index.ts ${{ matrix.id }} out/canada-${{ matrix.key }}-raw.mp4 --concurrency=100% --log=info ${FRAMES:+--frames=$FRAMES}

      - name: Tela curva + aberracao cromatica (ffmpeg, bilinear)
        run: node scripts/crt-post.mjs out/canada-${{ matrix.key }}-raw.mp4 out/canada-${{ matrix.key }}.mp4

      - name: Conferir saida
        run: ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of compact out/canada-${{ matrix.key }}.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: canada-${{ matrix.key }}
          path: out/canada-${{ matrix.key }}.mp4
          retention-days: 30
          compression-level: 0
