# Renderiza o video na nuvem (GitHub Actions) — o PC local nao precisa renderizar nada.
# Dispara sozinho a cada push em main que mude o video, ou manualmente em Actions > Render video > Run workflow.
# O MP4 final fica em: Actions > (execucao) > Artifacts > canada-intro
name: Render video

on:
  workflow_dispatch:
    inputs:
      frames:
        description: 'Intervalo de frames para um teste rapido (ex: 0-300). Vazio = video inteiro.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/crt-post.mjs'
      - 'remotion.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/render.yml'

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependencias do sistema (Chrome headless + ffmpeg)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg \
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libxrandr2 libxkbcommon0 libxfixes3 \
            libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 \
            libasound2t64 fonts-noto-color-emoji
          ffmpeg -hide_banner -version | head -1

      - name: Instalar pacotes
        run: npm ci

      - name: Baixar Chrome Headless Shell
        run: npx remotion browser ensure

      - name: Renderizar (Remotion)
        env:
          FRAMES: ${{ inputs.frames }}
        run: npx remotion render src/index.ts CanadaIntro out/canada-intro-raw.mp4 --concurrency=100% --log=info ${FRAMES:+--frames=$FRAMES}

      - name: Tela curva + aberracao cromatica (ffmpeg, bilinear)
        run: node scripts/crt-post.mjs out/canada-intro-raw.mp4 out/canada-intro.mp4

      - name: Conferir saida
        run: ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of compact out/canada-intro.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: canada-intro
          path: out/canada-intro.mp4
          retention-days: 30
          compression-level: 0
